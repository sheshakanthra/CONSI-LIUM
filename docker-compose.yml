# CONSILIUM local dev stack: Postgres+pgvector, API, web.
# WHY docker-compose: CLAUDE.md's definition of "done" requires each phase to
# run end-to-end locally via docker-compose. This is that baseline.

# WHY an explicit project name: without it Compose derives the project (and
# thus container/network/volume prefixes) from the directory name, which is
# COLLISIUM. Pinning it keeps everything named after the project regardless of
# the folder it's checked out into.
name: consilium

services:
  db:
    # pgvector's official image = Postgres 16 with the vector extension
    # available. The init script (mounted below) actually enables it.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: consilium
      POSTGRES_PASSWORD: consilium
      POSTGRES_DB: consilium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Bootstrap SQL: enables the vector extension on first init.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # WHY: gate the API on real DB readiness, not just "container started".
      test: ["CMD-SHELL", "pg_isready -U consilium -d consilium"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    # LLM secrets + provider selection come from apps/api/.env (gitignored, so it
    # holds the real keys). `required: false` keeps a fresh checkout — which has
    # no .env yet — able to `up` for ingestion/retrieval/tests; only /research
    # needs the key. NOTE: values in the `environment:` block below OVERRIDE
    # env_file, so anything that must differ per-container (DB host, /data paths)
    # lives there, while the keys are intentionally NOT repeated there so the
    # .env values win.
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      # Note the service name "db" as host — compose's internal DNS resolves it.
      # Overrides the host-oriented DATABASE_URL in .env with the in-network one.
      DATABASE_URL: postgresql+asyncpg://consilium:consilium@db:5432/consilium
      APP_NAME: consilium-api
      ENVIRONMENT: development
      # Ingestion reads local samples from the mounted /data tree (see volumes).
      FILINGS_DIR: /data/filings
      TRANSCRIPTS_DIR: /data/transcripts
      # faster-whisper settings (tiny/CPU/int8 for fast, GPU-free local runs).
      WHISPER_MODEL: tiny
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      # Cache Whisper weights under the mounted HF cache so they download once.
      HF_HOME: /root/.cache/huggingface
      # Model id isn't a secret and isn't in .env, so it stays here with a
      # sensible default (still shell-overridable). The provider + API keys
      # (LLM_PROVIDER / GROQ_API_KEY / ANTHROPIC_API_KEY / AGENT_MODEL) are
      # supplied by env_file above — do NOT re-add them here or they'd shadow it.
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "8000:8000"
    volumes:
      # Raw sample inputs (gitignored on the host) available to the container.
      - ./data:/data
      # Persist downloaded Whisper model weights across container restarts.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Python one-liner so we don't add curl to the slim image.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  hf_cache:
