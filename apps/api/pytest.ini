[pytest]
# asyncio_mode = auto lets async test functions run without decorating each one
# with @pytest.mark.asyncio (the ingestion tests are async because the pipeline
# and SQLAlchemy engine are async).
asyncio_mode = auto
# The async engine in app.db is created once at import and its asyncpg pool
# binds to the first event loop that uses it. A per-test loop would then break
# with "Event loop is closed", so we run all async fixtures/tests on ONE
# session-scoped loop (matching how the CLI runs under a single asyncio.run).
asyncio_default_fixture_loop_scope = session
testpaths = tests
markers =
    integration: end-to-end test that needs Postgres (and downloads a Whisper model)
filterwarnings =
    # Cosmetic: requests warns when urllib3/charset-normalizer versions are
    # newer than the set it was tested against. Harmless for our use.
    ignore::urllib3.exceptions.HTTPWarning
    ignore:.*urllib3.*:Warning:requests
